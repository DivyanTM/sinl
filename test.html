<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Analytics Flow Diagram</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
    }
    .icon-grid i {
      font-size: 2rem;
      margin: 0.5rem;
      color: #00a6a6;
    }
    .arrow {
      font-size: 2rem;
      color: #333;
    }
    .box {
      border: 2px solid #00a6a6;
      padding: 1rem;
      border-radius: 10px;
      text-align: center;
    }
    .cloud {
      border-radius: 20px;
      padding: 1rem 2rem;
      background: #e6f7f7;
      display: inline-block;
    }
    .dashed {
      border-top: 2px dashed #00a6a6;
      margin: 1rem 0;
    }
    .device-img {
      border: 1px solid #ccc;
      border-radius: 10px;
      width: 100%;
      max-width: 400px;
    }
  </style>
</head>
<body>

<div class="container my-5">

  <div class="row mb-4">
    <div class="col-md-4">
      <h5>Customer’s KPIs</h5>
      <div class="icon-grid d-flex flex-wrap">
        <i class="fas fa-chart-bar"></i>
        <i class="fas fa-bullseye"></i>
        <i class="fas fa-chart-line"></i>
        <i class="fas fa-chart-pie"></i>
        <i class="fas fa-clipboard-check"></i>
      </div>
    </div>

    <div class="col-md-4 offset-md-4">
      <div class="cloud text-center">
        <strong>Customer Cloud</strong>
      </div>
    </div>
  </div>

  <div class="row mb-4">
    <div class="col-md-4">
      <h5>Asset Data</h5>
      <div class="icon-grid d-flex flex-wrap">
        <i class="fas fa-tachometer-alt"></i>
        <i class="fas fa-bell"></i>
        <i class="fas fa-video"></i>
        <i class="fas fa-home"></i>
        <i class="fas fa-map-marker-alt"></i>
      </div>
    </div>

    <div class="col-md-4 text-center">
      <div class="box">
        <strong>Analytics</strong>
      </div>
      <div class="arrow my-2">➡️</div>
      <div class="cloud text-center">
        <strong>Customer Cloud</strong>
      </div>
    </div>

    <div class="col-md-4 text-center">
      <div class="dashed">Northbound Integration ➡️</div>
      <div class="mt-2">
        <i class="fas fa-network-wired fa-2x"></i><br>
        <small>3rd Party<br>MNG Systems</small>
      </div>
    </div>
  </div>

  <div class="row text-center mt-5">
    <div class="col-md-12">
      <div class="dashed">Transforming Data Into Graphical UI ➡️</div>
      <img src="54291766-879b-4e18-a46c-7a1913b588f7.png" alt="UI Screenshot" class="device-img mt-3">
    </div>
  </div>

</div>

</body>
</html>
